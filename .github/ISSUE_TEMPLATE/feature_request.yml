name: Feature request
description: Suggest an addition or change to CoreBudget
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What's missing or awkward today that this would fix?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: What would you like to see happen? Rough ideas are fine.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other ways you've thought about solving this, or workarounds you're using now.
    validations:
      required: false
